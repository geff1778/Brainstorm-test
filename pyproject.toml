[project]
name = "brainstorm"
version = "2.0.0"
description = "BrainStorm — realtime AI-powered quiz platform (Flask + Flask-SocketIO)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

# ── Ruff: linter + formatter ──────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "venv", "data", "static", "templates"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # long lines are handled by the formatter
    "B008", # function calls in argument defaults (Flask idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is expected in tests

# ── Pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:eventlet.*",
]

# ── Coverage ──────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
